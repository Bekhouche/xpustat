name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest moved to 26.04, which has no Python 3.9 build; 24.04 has both
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests -q
      - name: CLI smoke test on a machine without accelerators
        run: |
          python -m xpustat.cli --version
          python -m xpustat.cli --cpu
          python -m xpustat.cli --json --cpu
          python -m xpustat.cli --doctor

  package:
    name: sdist, wheel, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine mkdocs
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m mkdocs build --strict
